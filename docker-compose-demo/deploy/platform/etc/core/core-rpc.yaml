Name: platform.core.rpc
ListenOn: 0.0.0.0:19000
Timeout: 10000

Log:
  Mode: console
  Level: info

DB:
  Driver: postgres
  DSN: "host=postgres user=root password=root dbname=p9_platform port=5432 sslmode=disable TimeZone=UTC"

DataRedis:
  Host: redis:6379
  Pass: ""
  DB: 0

Jwt:
  AccessSecret: rbacx-example-secret
  AccessExpire: 86400
  RefreshSecret: rbacx-example-refresh-secret
  RefreshExpire: 604800

PartnerMode: "off"
APIPrefix: /admin
InitToken: change-me-init-token

