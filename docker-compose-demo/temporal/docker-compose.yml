services:
  postgresql:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    volumes:
      - temporal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    restart: always
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    ports:
      - "7233:7233"

  nginx-proxy:
    image: nginx:alpine
    container_name: temporal-nginx-proxy
    restart: always
    ports:
      # 映射到宿主机的 8081 端口（你可以改为任意你想访问的端口）
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - temporal-ui

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: temporal-ui
    restart: always
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      #TEMPORAL_CORS_ORIGINS: http://localhost:3000
        #ports:
        #- "8088:8080"
volumes:
  temporal_pg:
