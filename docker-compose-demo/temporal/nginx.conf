events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 提高传输效率
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # 开启 HTTP Basic Auth 密码认证
        auth_basic "Temporal UI Security Portal";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            # 转发请求到 Temporal UI 容器
            # 这里的 temporal-ui 是 docker-compose 中的服务名，8080 是其容器内端口
            proxy_pass http://temporal-ui:8080;
            
            # 传递原始请求头，防止 UI 路由或 Webhook 重定向失效
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 支持 WebSocket（Temporal UI 部分实时刷新功能需要）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}

