name: p9-platform

services:
  postgresql:
    # 当前：18.6（2025-09 发布）；备选：17.x（2024-09 发布，成熟度更高）
    image: postgres:18.6
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: p9_platform
    volumes:
      - postgresql-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d p9_platform"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    # 当前：8.8.0（2026-05 发布）；备选：8.2.x（2025-08 发布，成熟度更高）
    image: redis:8.8.0
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  etcd:
    image: gcr.io/etcd-development/etcd:v3.6.14
    restart: unless-stopped
    ports:
      - "12379:2379"
    volumes:
      - etcd-data:/etcd-data
    command:
      - /usr/local/bin/etcd
      - --name=platform-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgresql-data:
  redis-data:
  etcd-data: