# RPC 服务配置
Name: platform-game-rpc
ListenOn: 0.0.0.0:19003
Timeout: 10000
Mode: dev               # 运行模式

# Etcd服务注册配置
Etcd:
  Hosts:
    - 127.0.0.1:2379       # Etcd地址
  Key: platform-game-rpc    # 服务注册Key

# 数据库配置
Database:
  Driver: postgres
  DSN: "user=root password=root host=127.0.0.1 port=5432 dbname=app sslmode=disable"
  MaxConns: 20
  MaxIdle: 5

# 游戏供应商 gRPC 服务地址（用于同步）
#VendorGrpcServerAddr: 0.0.0.0:81

SyncBatchSize: 20

Kafka:
  Brokers:
    - "kafka:9092"

DatabaseConf:
  Host:     127.0.0.1     # 数据库地址
  Port:     5432          # 数据库端口
  DBName:   app           # 数据库名称
  Username: root          # 数据库用户名
  Password: root          # 数据库密码
  SSLMode:  disable       # SSL模式