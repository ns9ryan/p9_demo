syntax = "proto3";

package platform_game;

option go_package = "oa.98ent.com/p9/platform-game/rpc/pb/platform_game";

import "types/ping.proto";
import "types/game.proto";
import "types/game_category.proto";
import "types/game_provider.proto";
import "types/game_channel.proto";
import "types/game_currency.proto";
import "types/game_sync_checkpoint.proto";
import "types/sync.proto";

// ========== Ping Service ==========

// PingService - Ping健康检查服务
service PingService {
    // 健康检查
    rpc Ping(PingRequest) returns (PingResponse);
}

// ========== Game Service ==========

// GameService - 游戏服务
service GameService {
    // 获取游戏列表
    rpc GetGameList(GetGameListRequest) returns (GetGameListResp);
    
    // 获取单个游戏详情
    rpc GetGame(GetGameRequest) returns (GetGameResp);

    // 更新游戏
    rpc UpdateGame(UpdateGameRequest) returns (UpdateGameResp);
}

// ========== GameCategory Service ==========

// GameCategoryService - 游戏分类服务
service GameCategoryService {
    // 获取游戏分类列表
    rpc GetGameCategoryList(GetGameCategoryListRequest) returns (GetGameCategoryListResp);
    
    // 获取单个游戏分类
    rpc GetGameCategory(GetGameCategoryRequest) returns (GetGameCategoryResp);

    // 更新游戏分类
    rpc UpdateGameCategory(UpdateGameCategoryRequest) returns (UpdateGameCategoryResp);
}

// ========== GameProvider Service ==========

// GameProviderService - 游戏供应商服务
service GameProviderService {
    // 获取游戏供应商列表
    rpc GetGameProviderList(GetGameProviderListRequest) returns (GetGameProviderListResp);
    
    // 获取单个游戏供应商
    rpc GetGameProvider(GetGameProviderRequest) returns (GetGameProviderResp);

    // 更新游戏供应商
    rpc UpdateGameProvider(UpdateGameProviderRequest) returns (UpdateGameProviderResp);
}

// ========== GameChannel Service ==========

// GameChannelService - 游戏渠道服务
service GameChannelService {
    // 获取单个游戏渠道
    rpc GetGameChannel(GetGameChannelRequest) returns (GetGameChannelResp);
    
    // 获取游戏渠道列表
    rpc GetGameChannelList(GetGameChannelListRequest) returns (GetGameChannelListResp);

    // 更新游戏渠道
    rpc UpdateGameChannel(UpdateGameChannelRequest) returns (UpdateGameChannelResp);
}

// ========== GameCurrency Service ==========

// GameCurrencyService - 游戏货币服务
service GameCurrencyService {
    // 获取游戏货币列表
    rpc GetGameCurrencyList(GetGameCurrencyListRequest) returns (GetGameCurrencyListResp);
    
    // 获取单个游戏货币
    rpc GetGameCurrency(GetGameCurrencyRequest) returns (GetGameCurrencyResp);

    // 更新游戏货币
    rpc UpdateGameCurrency(UpdateGameCurrencyRequest) returns (UpdateGameCurrencyResp);
}

// ========== GameSyncCheckpoint Service ==========

// GameSyncCheckpointService - 游戏同步检查点服务
service GameSyncCheckpointService {
    // 获取单个同步检查点
    rpc GetGameSyncCheckpoint(GetGameSyncCheckpointRequest) returns (GetGameSyncCheckpointResp);

    // 获取同步检查点列表
    rpc GetGameSyncCheckpointList(GetGameSyncCheckpointListRequest) returns (GetGameSyncCheckpointListResp);
}

// ========== Sync Service ==========

// SyncService - 数据同步服务
service SyncService {
    // 同步预检查（查看差异，不修改数据）
    rpc SyncPreview(SyncPreviewRequest) returns (SyncPreviewResp);

    // 同步执行（执行同步操作）
    rpc SyncRun(SyncRunRequest) returns (SyncRunResp);

    // 执行 v2sql 下的 SQL 初始化脚本（供运维/初始化使用）
    rpc ExecuteV2Sql(ExecuteV2SqlRequest) returns (ExecuteV2SqlResp);
}
