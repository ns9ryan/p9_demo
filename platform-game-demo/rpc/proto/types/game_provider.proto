syntax = "proto3";

package platform_game;

option go_package = "oa.98ent.com/p9/platform-game/rpc/pb/platform_game";

// ProviderInfo 供应商信息
message ProviderInfo {
    int64 id = 1;
    int64 source_id = 2;
    string provider_code = 3;
    string source_provider_code = 4;
    string name_i18n = 5;
    string source_name_i18n = 6;
    string logo_url = 7;
    string source_logo_url = 8;
    int32 sort_no = 9;
    int32 status = 10;
    int32 source_status = 11;
    int32 is_deleted = 12;
    int64 created_at = 13;
    int64 updated_at = 14;
}

// GetGameProviderListRequest 获取游戏供应商列表请求
message GetGameProviderListRequest {
    int32 page = 1;
    int32 page_size = 2;
    string provider_code = 3;
    string name = 4;
    int32 status = 5;
    int32 is_deleted = 6;
    string sort_by = 7;     // id/sort_no/created_at
    string sort_order = 8;  // asc/desc
}

// GetGameProviderListResp 游戏供应商列表响应
message GetGameProviderListResp {
    int32 code = 1;
    string message = 2;
    repeated ProviderInfo data = 3;
    int64 total = 4;
}

// GetGameProviderRequest 获取单个游戏供应商请求
message GetGameProviderRequest {
    int64 id = 1;
}

// GetGameProviderResp 获取单个游戏供应商响应
message GetGameProviderResp {
    int32 code = 1;
    string message = 2;
    ProviderInfo data = 3;
}

// UpdateGameProviderRequest 更新供应商请求
message UpdateGameProviderRequest {
    int64 id = 1;
    string name_i18n = 2;
    int32 sort_no = 3;
    int32 status = 4;
    string logo_url = 5;
    bool force_logout = 6;
}

// UpdateGameProviderResp 更新供应商响应
message UpdateGameProviderResp {
    int32 code = 1;
    string message = 2;
    ProviderInfo data = 3;
}
