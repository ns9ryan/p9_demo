syntax = "proto3";

package platform_game;

option go_package = "oa.98ent.com/p9/platform-game/rpc/pb/platform_game";

// OperatorGameAllocationInfo 分站游戏信息
message OperatorGameAllocationInfo {
    int64 id = 1;
    string op_code = 2;
    string op_name = 3;
    int32 game_count = 4;
    int32 game_category_count = 5;
    int32 game_provider_count = 6;
    int32 game_channel_count = 7;
    int64 updated_at = 8;
}

// GetOperatorGameListRequest 获取分站游戏列表请求
message GetOperatorGameAllocationListRequest {
    int32 page = 1;
    int32 page_size = 2;
    string op_code = 3;
    int32 status = 4;
}

// GetOperatorGameAllocationListResp 分站游戏列表响应
message GetOperatorGameAllocationListResp {
    int32 code = 1;
    string message = 2;
    repeated OperatorGameAllocationInfo items = 3;
    int64 total = 4;
    int32 page = 5;
    int32 page_size = 6;
}
