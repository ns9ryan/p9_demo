syntax = "proto3";

package platform_game;

option go_package = "oa.98ent.com/p9/platform-game/rpc/pb/platform_game";

// OperatorGameChannelInfo 分站游戏渠道信息
message OperatorGameChannelInfo {
    int64 id = 1;
    string op_code = 2;
    string channel_code = 3;
    int32 status = 4;
    int64 created_at = 5;
    int64 updated_at = 6;
}

// GetOperatorGameChannelListRequest 获取分站游戏渠道列表请求
message GetOperatorGameChannelListRequest {
    int32 page = 1;
    int32 page_size = 2;
    string op_code = 3;
    string channel_code = 4;
    int32 status = 5;
}

// GetOperatorGameChannelListResp 分站游戏渠道列表响应
message GetOperatorGameChannelListResp {
    repeated OperatorGameChannelInfo items = 1;
    int64 total = 2;
    int32 page = 3;
    int32 page_size = 4;
}

// BatchCreateOperatorGameChannelItemRequest 批量创建分站游戏渠道请求项
message BatchCreateOperatorGameChannelItemRequest {
    string op_code = 1;
    string channel_code = 2;
    int32 status = 3;
}

// BatchCreateOperatorGameChannelRequest 批量创建分站游戏渠道请求
message BatchCreateOperatorGameChannelRequest {
    repeated BatchCreateOperatorGameChannelItemRequest items = 1;
}

// BatchCreateOperatorGameChannelResp 批量创建分站游戏渠道响应
message BatchCreateOperatorGameChannelResp {
    int64 total = 1;
    int64 success = 2;
    int64 failed = 3;
}

// BatchUpdateOperatorGameChannelStatusRequest 批量修改分站游戏渠道状态请求
message BatchUpdateOperatorGameChannelStatusRequest {
    repeated int64 ids = 1;
    int32 status = 2;
}

// BatchUpdateOperatorGameChannelStatusResp 批量修改分站游戏渠道状态响应
message BatchUpdateOperatorGameChannelStatusResp {
    int64 total = 1;
    int64 success = 2;
    int64 failed = 3;
}

// BatchDeleteOperatorGameChannelRequest 批量删除分站游戏渠道请求
message BatchDeleteOperatorGameChannelRequest {
    repeated int64 ids = 1;
}

// BatchDeleteOperatorGameChannelResp 批量删除分站游戏渠道响应
message BatchDeleteOperatorGameChannelResp {
    int64 total = 1;
    int64 success = 2;
    int64 failed = 3;
}