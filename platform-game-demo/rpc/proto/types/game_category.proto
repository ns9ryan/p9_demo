syntax = "proto3";

package platform_game;

option go_package = "oa.98ent.com/p9/platform-game/rpc/pb/platform_game";

// CategoryInfo 分类信息
message CategoryInfo {
    int64 id = 1;
    int64 source_id = 2;
    string category_code = 3;
    string source_category_code = 4;
    string name_i18n = 5;
    string source_name_i18n = 6;
    int32 sort_no = 7;
    int32 status = 8;
    int32 source_status = 9;
    int32 is_deleted = 10;
    int64 created_at = 11;
    int64 updated_at = 12;
}

// GetGameCategoryListRequest 获取游戏分类列表请求
message GetGameCategoryListRequest {
    int32 page = 1;
    int32 page_size = 2;
    string category_code = 3;
    string name = 4;
    int32 status = 5;
    int32 is_deleted = 6;
    string sort_by = 7;     // id/sort_no/created_at
    string sort_order = 8;  // asc/desc
}

// GetGameCategoryListResp 游戏分类列表响应
message GetGameCategoryListResp {
    int32 code = 1;
    string message = 2;
    repeated CategoryInfo data = 3;
    int64 total = 4;
    int32 page = 5;
    int32 page_size = 6;
}

// GetGameCategoryRequest 获取单个游戏分类请求
message GetGameCategoryRequest {
    int64 id = 1;
}

// GetGameCategoryResp 获取单个游戏分类响应
message GetGameCategoryResp {
    int32 code = 1;
    string message = 2;
    CategoryInfo data = 3;
}

// UpdateGameCategoryRequest 更新分类请求
message UpdateGameCategoryRequest {
    int64 id = 1;
    string name_i18n = 2;
    int32 sort_no = 3;
    int32 status = 4;
    bool force_logout = 5;
}

// UpdateGameCategoryResp 更新分类响应
message UpdateGameCategoryResp {
    int32 code = 1;
    string message = 2;
    CategoryInfo data = 3;
}
