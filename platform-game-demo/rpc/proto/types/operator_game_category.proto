syntax = "proto3";

package platform_game;

option go_package = "oa.98ent.com/p9/platform-game/rpc/pb/platform_game";

// OperatorGameCategoryInfo 分站游戏分类信息
message OperatorGameCategoryInfo {
    int64 id = 1;
    string op_code = 2;
    string category_code = 3;
    int32 status = 4;
    int32 check_status = 5;
    int64 created_at = 6;
    int64 updated_at = 7;
}

// GetOperatorGameCategoryListRequest 获取分站游戏分类列表请求
message GetOperatorGameCategoryListRequest {
    int32 page = 1;
    int32 page_size = 2;
    string op_code = 3;
    string category_code = 4;
    int32 check_status = 5;
}

// GetOperatorGameCategoryListResp 分站游戏分类列表响应
message GetOperatorGameCategoryListResp {
    repeated OperatorGameCategoryInfo items = 1;
    int64 total = 2;
    int32 page = 3;
    int32 page_size = 4;
}

// BatchUpdateOperatorGameCategoryStatusRequest 批量修改分站游戏分类状态请求
message BatchUpdateOperatorGameCategoryStatusRequest {
    repeated int64 ids = 1;
    int32 status = 2;
}

// BatchUpdateOperatorGameCategoryStatusResp 批量修改分站游戏分类状态响应
message BatchUpdateOperatorGameCategoryStatusResp {
    int64 total = 1;
    int64 success = 2;
    int64 failed = 3;
}

message SaveOperatorGameCategoryAllocationInfo {
    string code = 1;
    int32 check_status = 2;
}

// SaveOperatorGameCategoryAllocationRequest 保存分站游戏分类分配请求项
message SaveOperatorGameCategoryAllocationRequest {
    string op_code = 1;
    repeated SaveOperatorGameCategoryAllocationInfo items = 2;
}

// SaveOperatorGameCategoryAllocationResp 保存分站游戏分类分配响应
message SaveOperatorGameCategoryAllocationResp {
    int64 total = 1;
    int64 created = 2;
    int64 deleted = 3;
    int64 exist = 4;
    int64 failed = 5;
}