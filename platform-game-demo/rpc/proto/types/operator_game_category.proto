syntax = "proto3";

package platform_game;

option go_package = "oa.98ent.com/p9/platform-game/rpc/pb/platform_game";

// OperatorGameCategoryInfo 分站游戏分类信息
message OperatorGameCategoryInfo {
    int64 id = 1;
    string op_code = 2;
    string category_code = 3;
    int32 status = 4;
    int64 created_at = 5;
    int64 updated_at = 6;
}

// GetOperatorGameCategoryListRequest 获取分站游戏分类列表请求
message GetOperatorGameCategoryListRequest {
    int32 page = 1;
    int32 page_size = 2;
    string op_code = 3;
    string category_code = 4;
    int32 status = 5;
}

// GetOperatorGameCategoryListResp 分站游戏分类列表响应
message GetOperatorGameCategoryListResp {
    repeated OperatorGameCategoryInfo items = 1;
    int64 total = 2;
    int32 page = 3;
    int32 page_size = 4;
}

// BatchCreateOperatorGameCategoryItemRequest 批量创建分站游戏分类请求项
message BatchCreateOperatorGameCategoryItemRequest {
    string op_code = 1;
    string category_code = 2;
    int32 status = 3;
}

// BatchCreateOperatorGameCategoryRequest 批量创建分站游戏分类请求
message BatchCreateOperatorGameCategoryRequest {
    repeated BatchCreateOperatorGameCategoryItemRequest items = 1;
}

// BatchCreateOperatorGameCategoryResp 批量创建分站游戏分类响应
message BatchCreateOperatorGameCategoryResp {
    int64 total = 1;
    int64 success = 2;
    int64 failed = 3;
}

// BatchUpdateOperatorGameCategoryStatusRequest 批量修改分站游戏分类状态请求
message BatchUpdateOperatorGameCategoryStatusRequest {
    repeated int64 ids = 1;
    int32 status = 2;
}

// BatchUpdateOperatorGameCategoryStatusResp 批量修改分站游戏分类状态响应
message BatchUpdateOperatorGameCategoryStatusResp {
    int64 total = 1;
    int64 success = 2;
    int64 failed = 3;
}

// BatchDeleteOperatorGameCategoryRequest 批量删除分站游戏分类请求
message BatchDeleteOperatorGameCategoryRequest {
    repeated int64 ids = 1;
}

// BatchDeleteOperatorGameCategoryResp 批量删除分站游戏分类响应
message BatchDeleteOperatorGameCategoryResp {
    int64 total = 1;
    int64 success = 2;
    int64 failed = 3;
}