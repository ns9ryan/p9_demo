syntax = "proto3";

package platform_game;

option go_package = "oa.98ent.com/p9/platform-game/rpc/pb/platform_game";

// OperatorGameProviderInfo 分站游戏提供商信息
message OperatorGameProviderInfo {
    int64 id = 1;
    string op_code = 2;
    string provider_code = 3;
    int32 status = 4;
    int64 created_at = 5;
    int64 updated_at = 6;
}

// GetOperatorGameProviderListRequest 获取分站游戏提供商列表请求
message GetOperatorGameProviderListRequest {
    int32 page = 1;
    int32 page_size = 2;
    string op_code = 3;
    string provider_code = 4;
    int32 status = 5;
}

// GetOperatorGameProviderListResp 分站游戏提供商列表响应
message GetOperatorGameProviderListResp {
    repeated OperatorGameProviderInfo items = 1;
    int64 total = 2;
    int32 page = 3;
    int32 page_size = 4;
}

// BatchCreateOperatorGameProviderItemRequest 批量创建分站游戏提供商请求项
message BatchCreateOperatorGameProviderItemRequest {
    string op_code = 1;
    string provider_code = 2;
    int32 status = 3;
}

// BatchCreateOperatorGameProviderRequest 批量创建分站游戏提供商请求
message BatchCreateOperatorGameProviderRequest {
    repeated BatchCreateOperatorGameProviderItemRequest items = 1;
}

// BatchCreateOperatorGameProviderResp 批量创建分站游戏提供商响应
message BatchCreateOperatorGameProviderResp {
    int64 total = 1;
    int64 success = 2;
    int64 failed = 3;
}

// BatchUpdateOperatorGameProviderStatusRequest 批量修改分站游戏提供商状态请求
message BatchUpdateOperatorGameProviderStatusRequest {
    repeated int64 ids = 1;
    int32 status = 2;
}

// BatchUpdateOperatorGameProviderStatusResp 批量修改分站游戏提供商状态响应
message BatchUpdateOperatorGameProviderStatusResp {
    int64 total = 1;
    int64 success = 2;
    int64 failed = 3;
}

// BatchDeleteOperatorGameProviderRequest 批量删除分站游戏提供商请求
message BatchDeleteOperatorGameProviderRequest {
    repeated int64 ids = 1;
}

// BatchDeleteOperatorGameProviderResp 批量删除分站游戏提供商响应
message BatchDeleteOperatorGameProviderResp {
    int64 total = 1;
    int64 success = 2;
    int64 failed = 3;
}