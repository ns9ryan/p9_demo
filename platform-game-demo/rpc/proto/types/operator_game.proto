syntax = "proto3";

package platform_game;

option go_package = "oa.98ent.com/p9/platform-game/rpc/pb/platform_game";

// OperatorGameInfo 分站游戏信息
message OperatorGameInfo {
    int64 id = 1;
    string op_code = 2;
    string game_code = 3;
    string name = 4;
    int32 status = 5;
    int64 created_at = 6;
    int64 updated_at = 7;
}

// GetOperatorGameListRequest 获取分站游戏列表请求
message GetOperatorGameListRequest {
    int32 page = 1;
    int32 page_size = 2;
    string op_code = 3;
    string game_code = 4;
    int32 status = 5;
}

// GetOperatorGameListResp 分站游戏列表响应
message GetOperatorGameListResp {
    repeated OperatorGameInfo items = 1;
    int64 total = 2;
    int32 page = 3;
    int32 page_size = 4;
}

// BatchCreateOperatorGameItemRequest 批量创建分站游戏请求项
message BatchCreateOperatorGameItemRequest {
    string op_code = 1;
    string game_code = 2;
    string name = 3;
    int32 status = 4;
}

// BatchCreateOperatorGameRequest 批量创建分站游戏请求
message BatchCreateOperatorGameRequest {
    repeated BatchCreateOperatorGameItemRequest items = 1;
}

// BatchCreateOperatorGameResp 批量创建分站游戏响应
message BatchCreateOperatorGameResp {
    int64 total = 1;
    int64 success = 2;
    int64 failed = 3;
}

// BatchUpdateOperatorGameStatusRequest 批量修改分站游戏状态请求
message BatchUpdateOperatorGameStatusRequest {
    repeated int64 ids = 1;
    int32 status = 2;
}

// BatchUpdateOperatorGameStatusResp 批量修改分站游戏状态响应
message BatchUpdateOperatorGameStatusResp {
    int64 total = 1;
    int64 success = 2;
    int64 failed = 3;
}

// BatchDeleteOperatorGameRequest 批量删除分站游戏请求
message BatchDeleteOperatorGameRequest {
    repeated int64 ids = 1;
}

// BatchDeleteOperatorGameResp 批量删除分站游戏响应
message BatchDeleteOperatorGameResp {
    int64 total = 1;
    int64 success = 2;
    int64 failed = 3;
}