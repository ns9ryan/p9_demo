syntax = "proto3";

package platform_game;

option go_package = "oa.98ent.com/p9/platform-game/rpc/pb/platform_game";
    
// GameChannelInfo 游戏渠道信息（包含名称）
message GameChannelInfo {
    int64 id = 1;
    int64 source_id = 2;
    string channel_code = 3;
    string source_channel_code = 4;
    string name_key = 5;
    int32 sort_no = 6;
    int32 source_sort_no = 7;
    int32 load_type = 8;
    int32 source_load_type = 9;
    int32 status = 10;
    int32 source_status = 11;
    int32 is_deleted = 12;
    int64 created_at = 13;
    int64 updated_at = 14;
}

// GetGameChannelRequest 获取单个游戏渠道请求
message GetGameChannelRequest {
    int64 id = 1;
}

// GetGameChannelResp 获取单个游戏渠道响应
message GetGameChannelResp {
    int32 code = 1;
    string message = 2;
    GameChannelInfo data = 3;
}

// GetGameChannelListRequest 获取游戏渠道列表请求
message GetGameChannelListRequest {
    int32 page = 1;
    int32 page_size = 2;
    string channel_code = 3;
    int32 status = 4;
    int32 is_deleted = 5;  // 0=未删除(默认), 1=已删除, 其他=不过滤
}

// GetGameChannelListResp 游戏渠道列表响应
message GetGameChannelListResp {
    int32 code = 1;
    string message = 2;
    repeated GameChannelInfo items = 3;
    int64 total = 4;
    int32 page = 5;
    int32 page_size = 6;
}

// UpdateGameChannelRequest 更新渠道请求
message UpdateGameChannelRequest {
    int64 id = 1;
    int32 sort_no = 2;
    int32 status = 3;
    bool force_logout = 4;
}

// UpdateGameChannelResp 更新渠道响应
message UpdateGameChannelResp {
    int32 code = 1;
    string message = 2;
    GameChannelInfo data = 3;
}
