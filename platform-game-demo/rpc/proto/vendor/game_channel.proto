syntax = "proto3";

package vendors;

option go_package = "oa.98ent.com/p9/platform-game/rpc/pb/vendors";

// ===============================
// 游戏渠道
// ===============================

// GameChannelInfo 游戏渠道（来自 game-vendor-gateway 返回值）
message GameChannelInfo {
  int64 id = 1;
  string code = 2;
  string name = 3;
  string currency = 4;
  int64 weight = 5;
  uint32 status = 6;        // 1.Normal 2.Disabled
  map<string, string> extra = 7;
  uint32 update_utype = 8;
  int64 update_uid = 9;
  int64 updates = 10;
  int64 update_at = 11;
  uint32 create_utype = 12;
  int64 create_uid = 13;
  int64 create_at = 14;
  uint32 load_type = 15;    // GameLoadType 1.Embed 2.Ext link
}

// GetChannelResponse 获取游戏渠道列表响应
message GetChannelResponse {
  int64 code = 1;
  string msg = 2;
  repeated GameChannelInfo channel_list = 3;
}
