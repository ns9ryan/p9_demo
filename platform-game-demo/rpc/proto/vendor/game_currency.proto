syntax = "proto3";

package vendors;

option go_package = "oa.98ent.com/p9/platform-game/rpc/pb/vendors";

// ===============================
// 游戏货币
// ===============================

// GameCurrencyInfo 游戏货币（来自 game-vendor-gateway 返回值）
message GameCurrencyInfo {
    int64 id = 1;
    int64 game_id = 2;
    int64 currency_id = 3;
    int32 status = 4;
}

// GetGameCurrencyResponse 获取游戏货币列表响应
message GetGameCurrencyResponse {
  int64 code = 1;
  string msg = 2;
  repeated GameCurrencyInfo game_currency_list = 3;
}
