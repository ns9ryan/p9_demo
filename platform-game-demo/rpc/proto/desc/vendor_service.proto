syntax = "proto3";

package vendors;

option go_package = "oa.98ent.com/p9/platform-game/rpc/pb/vendors";

import "category.proto";
import "provider.proto";
import "channel.proto";
import "game.proto";
import "google/protobuf/empty.proto";

// VendorGameService - 游戏供应商服务（对接 game-vendor-gateway）
service VendorGameService {
    // 获取游戏分类
    rpc GetGameCategory(google.protobuf.Empty) returns (GetGameCategoryResp);
    
    // 获取游戏提供商
    rpc GetVendor(google.protobuf.Empty) returns (GetVendorResp);
    
    // 获取游戏渠道
    rpc GetChannel(google.protobuf.Empty) returns (GetGameChannelResp);
    
    // 获取游戏
    rpc GetGame(google.protobuf.Empty) returns (GetGameResp);
    
    // 获取游戏货币
    rpc GetGameCurrency(google.protobuf.Empty) returns (GetGameCurrencyResp);
}

// 游戏分类响应
message GetGameCategoryResp {
    int32 code = 1;
    string message = 2;
    repeated GameCategoryInfo data = 3;
}

// 游戏提供商响应
message GetVendorResp {
    int32 code = 1;
    string message = 2;
    repeated VendorInfo data = 3;
}

// 游戏渠道响应
message GetGameChannelResp {
    int32 code = 1;
    string message = 2;
    repeated GameChannelInfo data = 3;
}

// 游戏响应
message GetGameResp {
    int32 code = 1;
    string message = 2;
    repeated GameInfo data = 3;
}

// 游戏货币响应
message GetGameCurrencyResp {
    int32 code = 1;
    string message = 2;
    repeated GameCurrencyInfo data = 3;
}

// 游戏货币信息
message GameCurrencyInfo {
    int64 game_id = 1;
    string currency_code = 2;
    int32 status = 3;
    int64 created_at = 4;
    int64 updated_at = 5;
}
