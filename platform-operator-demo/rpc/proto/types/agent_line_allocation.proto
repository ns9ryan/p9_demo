syntax = "proto3";

package agentlineallocation;

option go_package = "oa.98ent.com/p9/platform-operator/rpc/pb/operator/agentlineallocation";

// 分站代理子线路分配信息
message AgentLineAllocationInfo {
  // 分配记录ID
  int64 id = 1;
  // 分站ID
  int64 operator_id = 2;
  // 代理子线路编码
  string agent_line_code = 3;
  // 分配时间, Unix毫秒时间戳
  int64 created_at = 4;
}

// 获取代理子线路分配列表请求
message ListAgentLineAllocationsRequest {
  // 页码, 从1开始
  int64 page = 1;
  // 每页数量
  int64 page_size = 2;
  // 分站ID
  optional int64 operator_id = 3;
  // 代理子线路编码
  optional string agent_line_code = 4;
}

// 获取代理子线路分配列表响应
message ListAgentLineAllocationsResponse {
  // 数据总数
  int64 total = 1;
  // 代理子线路分配列表
  repeated AgentLineAllocationInfo list = 2;
}

// 分配代理子线路请求
message AssignAgentLineRequest {
  // 分站ID
  int64 operator_id = 1;
  // 代理子线路编码
  string agent_line_code = 2;
}

// 分配代理子线路响应
message AssignAgentLineResponse {
  // 分配记录ID
  int64 id = 1;
}

// 取消代理子线路分配请求
message UnassignAgentLineRequest {
  // 分站ID
  int64 operator_id = 1;
  // 代理子线路编码
  string agent_line_code = 2;
}

// 取消代理子线路分配响应
message UnassignAgentLineResponse {}