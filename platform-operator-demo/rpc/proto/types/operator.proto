syntax = "proto3";

package operator;

option go_package = "oa.98ent.com/p9/platform-operator/rpc/pb/operator/operator";

// 分站信息
message OperatorInfo {
  // 分站ID
  int64 id = 1;
  // 分站业务编码
  string code = 2;
  // 分站名称
  string name = 3;
  // 时区编码
  string timezone_code = 4;
  // 结算币种编码
  string settlement_currency_code = 5;
  // 创建状态: 1草稿, 2已完成
  int64 creation_status = 6;
  // 发布状态: 1未发布, 2发布中, 3已发布, 4发布失败
  int64 publish_status = 7;
  // 分站状态: 1正常, 2暂停, 3关闭
  int64 status = 8;
  // 内部备注
  optional string remark = 9;
  // 首次发布成功时间, Unix毫秒时间戳
  optional int64 published_at = 10;
  // 创建时间, Unix毫秒时间戳
  int64 created_at = 11;
  // 更新时间, Unix毫秒时间戳
  int64 updated_at = 12;
}

// 创建分站请求
message CreateOperatorRequest {
  // 分站名称
  string name = 1;
  // 时区编码
  string timezone_code = 2;
  // 结算币种编码
  string settlement_currency_code = 3;
  // 分站状态: 1正常, 2暂停, 3关闭
  optional int64 status = 4;
  // 内部备注
  optional string remark = 5;
}

// 创建分站响应
message CreateOperatorResponse {
  // 分站ID
  int64 id = 1;
  // 分站业务编码
  string code = 2;
}

// 修改分站请求
message UpdateOperatorRequest {
  // 分站ID
  int64 id = 1;
  // 分站名称
  optional string name = 2;
  // 时区编码
  optional string timezone_code = 3;
  // 结算币种编码
  optional string settlement_currency_code = 4;
  // 分站状态: 1正常, 2暂停, 3关闭
  optional int64 status = 5;
  // 内部备注
  optional string remark = 6;
}

// 修改分站响应
message UpdateOperatorResponse {}

// 获取分站请求
message GetOperatorRequest {
  // 分站ID
  int64 id = 1;
}

// 获取分站响应
message GetOperatorResponse {
  // 分站信息
  OperatorInfo operator = 1;
}

// 获取分站列表请求
message ListOperatorsRequest {
  // 页码, 从1开始
  int64 page = 1;
  // 每页数量
  int64 page_size = 2;
  // 搜索关键字, 匹配分站编码或名称
  optional string keyword = 3;
  // 创建状态: 1草稿, 2已完成
  optional int64 creation_status = 4;
  // 发布状态: 1未发布, 2发布中, 3已发布, 4发布失败
  optional int64 publish_status = 5;
  // 分站状态: 1正常, 2暂停, 3关闭
  optional int64 status = 6;
}

// 获取分站列表响应
message ListOperatorsResponse {
  // 数据总数
  int64 total = 1;
  // 分站列表
  repeated OperatorInfo list = 2;
}

// 完成分站创建请求
message CompleteOperatorRequest {
  // 分站ID
  int64 id = 1;
}

// 完成分站创建响应
message CompleteOperatorResponse {}

// 发布分站请求
message PublishOperatorRequest {
  // 分站ID
  int64 id = 1;
}

// 发布分站响应
message PublishOperatorResponse {}