syntax = "proto3";

package languageallocation;

option go_package = "oa.98ent.com/p9/platform-operator/rpc/pb/operator/languageallocation";

// 分站语言分配信息
message LanguageAllocationInfo {
  // 分配记录ID
  int64 id = 1;
  // 分站ID
  int64 operator_id = 2;
  // 语言编码
  string language_code = 3;
  // 分配时间, Unix毫秒时间戳
  int64 created_at = 4;
}

// 获取语言分配列表请求
message ListLanguageAllocationsRequest {
  // 页码, 从1开始
  int64 page = 1;
  // 每页数量
  int64 page_size = 2;
  // 分站ID
  optional int64 operator_id = 3;
  // 语言编码
  optional string language_code = 4;
}

// 获取语言分配列表响应
message ListLanguageAllocationsResponse {
  // 数据总数
  int64 total = 1;
  // 语言分配列表
  repeated LanguageAllocationInfo list = 2;
}

// 分配语言请求
message AssignLanguageRequest {
  // 分站ID
  int64 operator_id = 1;
  // 语言编码
  string language_code = 2;
}

// 分配语言响应
message AssignLanguageResponse {
  // 分配记录ID
  int64 id = 1;
}

// 取消语言分配请求
message UnassignLanguageRequest {
  // 分站ID
  int64 operator_id = 1;
  // 语言编码
  string language_code = 2;
}

// 取消语言分配响应
message UnassignLanguageResponse {}