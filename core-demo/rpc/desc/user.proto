syntax = "proto3";

message UserPublic {
  int64 id = 1;
  string user_code = 2;
  string username = 3;
  string display_name = 4;
  optional int64 operator_id = 5;
  bool is_super_admin = 6;
  int32 status = 7;
  repeated string role_codes = 8;
  string home_path = 9;
  int64 created_at = 10;
  optional int64 last_login_at = 11;
  optional string mobile = 12;
  optional string email = 13;
  repeated string role_names = 14;
}

message SelfPasswordReq {
  string old_password = 1;
  string password = 2;
}

message PermResp {
  repeated string permissions = 1;
}

message CreateUserReq {
  string username = 1;
  string password = 2;
  string display_name = 3;
  optional string mobile = 4;
  optional string email = 5;
  int32 status = 6;
  repeated int64 role_ids = 7;
}

message UpdateUserReq {
  int64 id = 1;
  optional string display_name = 2;
  optional string mobile = 3;
  optional string email = 4;
  optional int32 status = 5;
}

message UserListReq {
  int32 page = 1;
  int32 page_size = 2;
  string username = 3;
  string mobile = 4;
  string email = 5;
  string display_name = 6;
  repeated int64 role_ids = 7;
}

message UserListResp {
  repeated UserPublic list = 1;
  int64 total = 2;
}

message PasswordReq {
  int64 user_id = 1;
  string password = 2;
}

message BindRolesReq {
  int64 user_id = 1;
  repeated int64 role_ids = 2;
}

service Core {
  // User management
  // group: user
  rpc getUserInfo (Empty) returns (UserPublic);
  // group: user
  rpc getUserPerm (Empty) returns (PermResp);
  // group: user
  rpc changeOwnPassword (SelfPasswordReq) returns (Empty);
  // group: user
  rpc createUser (CreateUserReq) returns (UserPublic);
  // group: user
  rpc updateUser (UpdateUserReq) returns (Empty);
  // group: user
  rpc deleteUser (IDsReq) returns (Empty);
  // group: user
  rpc getUserList (UserListReq) returns (UserListResp);
  // group: user
  rpc getUserById (IDReq) returns (UserPublic);
  // group: user
  rpc updateUserPassword (PasswordReq) returns (Empty);
  // group: user
  rpc bindUserRoles (BindRolesReq) returns (Empty);
}
