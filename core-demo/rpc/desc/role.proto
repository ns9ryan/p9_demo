syntax = "proto3";

message RoleInfo {
  int64 id = 1;
  optional int64 operator_id = 2;
  string role_code = 3;
  string role_name = 4;
  optional string description = 5;
  int32 status = 6;
  bool is_system = 7;
  int32 sort_no = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
}

message CreateRoleReq {
  string role_code = 1;
  string role_name = 2;
  string description = 3;
  int32 status = 4;
  int32 sort_no = 5;
}

message UpdateRoleReq {
  int64 id = 1;
  optional string role_name = 2;
  optional string description = 3;
  optional int32 status = 4;
  optional int32 sort_no = 5;
}

message RoleListReq {
  int32 page = 1;
  int32 page_size = 2;
  string role_name = 3;
}

message RoleListResp {
  repeated RoleInfo list = 1;
  int64 total = 2;
}

service Core {
  // Role management
  // group: role
  rpc createRole (CreateRoleReq) returns (RoleInfo);
  // group: role
  rpc updateRole (UpdateRoleReq) returns (Empty);
  // group: role
  rpc deleteRole (IDsReq) returns (Empty);
  // group: role
  rpc getRoleList (RoleListReq) returns (RoleListResp);
  // group: role
  rpc getRoleById (IDReq) returns (RoleInfo);
}
