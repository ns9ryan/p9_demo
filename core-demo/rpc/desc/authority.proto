syntax = "proto3";

message MenuAuthReq {
  int64 role_id = 1;
  repeated int64 menu_ids = 2;
}

message MenuAuthResp {
  repeated int64 menu_ids = 1;
}

message ApiAuthItem {
  string path = 1;
  string method = 2;
}

message ApiAuthReq {
  int64 role_id = 1;
  repeated ApiAuthItem data = 2;
}

message ApiAuthResp {
  repeated ApiAuthItem list = 1;
}

message RoleIdReq {
  int64 role_id = 1;
  int64 id = 2;
}

service Core {
  // authorization management service
  // group: authority
  rpc updateMenuAuthority (MenuAuthReq) returns (Empty);
  // group: authority
  rpc getMenuAuthority (RoleIdReq) returns (MenuAuthResp);
  // group: authority
  rpc updateApiAuthority (ApiAuthReq) returns (Empty);
  // group: authority
  rpc getApiAuthority (RoleIdReq) returns (ApiAuthResp);
}
