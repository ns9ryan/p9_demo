syntax = "proto3";

message ApiInfo {
  int64 id = 1;
  string description = 2;
  string api_group = 3;
  string method = 4;
  string path = 5;
  int32 is_required = 6;
  string service_name = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
  optional string test = 10;
}

message CreateApiReq {
  string description = 1;
  string api_group = 2;
  string method = 3;
  string path = 4;
  int32 is_required = 5;
  string service_name = 6;
}

message UpdateApiReq {
  int64 id = 1;
  optional string description = 2;
  optional string api_group = 3;
  optional string method = 4;
  optional string path = 5;
  optional int32 is_required = 6;
  optional string service_name = 7;
}

message ApiListReq {
  int32 page = 1;
  int32 page_size = 2;
  string path = 3;
  string method = 4;
  string api_group = 5;
  string service_name = 6;
  string description = 7;
}

message ApiListResp {
  repeated ApiInfo list = 1;
  int64 total = 2;
}

service Core {
  // API management
  // group: api
  rpc createApi (CreateApiReq) returns (ApiInfo);
  // group: api
  rpc updateApi (UpdateApiReq) returns (Empty);
  // group: api
  rpc deleteApi (IDsReq) returns (Empty);
  // group: api
  rpc getApiList (ApiListReq) returns (ApiListResp);
  // group: api
  rpc registerApi (CreateApiReq) returns (ApiInfo);
}
