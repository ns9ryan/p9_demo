Name: operator-core-rpc
ListenOn: 0.0.0.0:19100
Timeout: 10000

Log:
  Mode: console
  Level: info

DB:
  Driver: postgres
  DSN: "host=127.0.0.1 user=postgres password=app123 dbname=demo port=5432 sslmode=disable TimeZone=UTC"

DataRedis:
  Host: 127.0.0.1:6379
  Pass: ""
  DB: 0

Jwt:
  AccessSecret: rbacx-example-secret
  AccessExpire: 86400
  RefreshSecret: rbacx-example-refresh-secret
  RefreshExpire: 604800

PartnerMode: "on"
APIPrefix: /admin
InitToken: change-me-init-token
