Name: platform-core-rpc
ListenOn: 0.0.0.0:19000
Timeout: 10000

Log:
  Mode: console
  Level: info
# 开发模式
Mode: dev

DB:
  Driver: postgres
  DSN: "host=127.0.0.1 user=root password=root dbname=p9_platform port=15432 sslmode=disable TimeZone=UTC"

DataRedis:
  Host: 127.0.0.1:16379
  Pass: ""
  DB: 0

Jwt:
  AccessSecret: rbacx-example-secret
  AccessExpire: 86400
  RefreshSecret: rbacx-example-refresh-secret
  RefreshExpire: 604800

PartnerMode: "off"
APIPrefix: /admin
InitToken: change-me-init-token
