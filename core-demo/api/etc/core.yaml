Name: platform-core-api
Host: 0.0.0.0
Port: 18000
Mode: dev # 开发模式

Log:
  Mode: console
  Level: info

# 链路追踪, 生产建议 Sampler 0.01~0.1
Telemetry:
  Name: platform-core-api
  Endpoint: 127.0.0.1:4317
  Sampler: 1.0
  Batcher: otlpgrpc

# 模式 on分站，off总网
PartnerMode: "off"

# CORS配置
CROSConf:
  Address: '*'

CoreRpc:
  # Endpoints:
  #   - 127.0.0.1:19000
  Etcd:
    Hosts:
      - 127.0.0.1:12379
    Key: platform-core-rpc
  NonBlock: true
  Timeout: 3000
