Name: core.rpc
ListenOn: 0.0.0.0:19000
Timeout: 10000

Log:
  Mode: console
  Level: info

DB:
  Driver: postgres
  DSN: "host=postgres user=postgres password=app123 dbname=postgres port=5432 sslmode=disable TimeZone=UTC"

DataRedis:
  Host: redis:6379
  Pass: ""
  DB: 0

Jwt:
  AccessSecret: rbacx-example-secret
  AccessExpire: 86400
  RefreshSecret: rbacx-example-refresh-secret
  RefreshExpire: 604800

PartnerMode: "on"
APIPrefix: /admin
InitToken: change-me-init-token
