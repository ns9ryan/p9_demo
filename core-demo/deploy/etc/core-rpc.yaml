Name: core.rpc
ListenOn: 0.0.0.0:19000
Timeout: 10000

Log:
  Mode: console
  Level: info

# 链路追踪, 生产建议 Sampler 0.01~0.1
Telemetry:
  Name: core.rpc
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc

DB:
  Driver: postgres
  DSN: "host=postgres user=root password=root dbname=p9_platform port=15432 sslmode=disable TimeZone=UTC"

DataRedis:
  Host: redis:6379
  Pass: ""
  DB: 0

Jwt:
  AccessSecret: rbacx-example-secret
  AccessExpire: 86400
  RefreshSecret: rbacx-example-refresh-secret
  RefreshExpire: 604800

PartnerMode: "on"
APIPrefix: /admin
InitToken: change-me-init-token
